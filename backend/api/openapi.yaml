openapi: 3.1.1
info:
  title: Sama HTTP contract
  version: 0.0.0
  description: >-
    This source contract documents implemented liveness, OIDC login/logout,
    current-user and workspace routes and the shared HTTP problem envelope. Future entity identifiers use canonical
    lowercase hyphenated UUIDv7 strings; request_id is a separate bounded
    correlation value and is not an entity identifier or secret.
servers:
  - url: /
paths:
  /api/v1/workspaces/{workspace_id}/overview:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getWorkspaceOverview
      security: [{session: []}]
      responses:
        '200':
          description: Authorized local totals and at most 50 connection health rows; never provider traffic.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceOverview'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/audit-events:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      - {name: cursor, in: query, schema: {type: string, maxLength: 1024}}
      - {name: actor_id, in: query, schema: {type: string, format: uuid}}
      - {name: action, in: query, schema: {type: string, maxLength: 64}}
      - {name: target_id, in: query, schema: {type: string, format: uuid}}
    get:
      operationId: listAuditEvents
      security: [{session: []}]
      responses:
        '200':
          description: Current permission-filtered history in descending timestamp/ID order; no provider traffic.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPage'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/operations/{operation_id}:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: operation_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getOperation
      security: [{session: []}]
      responses:
        '200':
          description: Stored outcome preserved; unknown remains explicitly uncertain. Out-of-scope IDs return 404.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationView'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/operations:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listOperations
      security: [{session: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 1024}}
      responses:
        '200':
          description: Current permission-filtered local operation evidence with bounded events.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationPage'}
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: acceptOperation
      security: [{session: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [review_id, confirmed]
              properties:
                review_id: {type: string, format: uuid}
                confirmed: {type: boolean, enum: [true]}
                typed_target: {type: string, maxLength: 200}
      responses:
        '202':
          description: Durable acceptance or recovery of the original operation; no provider completion claim.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedOperation'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/operations/{operation_id}/cancel:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: operation_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: cancelOperation
      security: [{session: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: Cancel queued work atomically; dispatching or submitted returns 409.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedOperation'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/operations/{operation_id}/reconciliations:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: operation_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: recheckOperation
      security: [{session: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: Coalesce a five-minute read-only recheck of an unknown reserved outcome; never resubmit.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedOperation'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/operations/{operation_id}/reservation-release:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: operation_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: releaseOperationReservation
      security: [{session: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReservationRelease'}
      responses:
        '200':
          description: Owner with recent authentication records residual risk; outcome remains unknown.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedOperation'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/resources/{resource_id}/action-reviews:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: resource_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: prepareActionReview
      security: [{session: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PowerIntent'}
      responses:
        '200':
          description: Expiring server-owned review bound to current authority and fresh preconditions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionReview'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/resources/{resource_id}:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: resource_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getResource
      security: [{session: []}]
      responses:
        '200':
          description: Safe typed local detail and advisory capability reasons.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourceDetail'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/resources:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      - {name: cursor, in: query, schema: {type: string, maxLength: 1024}}
      - {name: connection_id, in: query, schema: {type: string, format: uuid}}
      - {name: provider, in: query, schema: {type: string, maxLength: 64}}
      - {name: type, in: query, schema: {type: string, enum: [compute.server]}}
      - {name: region, in: query, schema: {type: string, maxLength: 128}}
      - {name: account, in: query, schema: {type: string, maxLength: 512}}
    get:
      operationId: listResources
      security: [{session: []}]
      responses:
        '200':
          description: Permission-filtered complete local observations in UUID order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResourcePage'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/syncs/{sync_id}:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: sync_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getSyncStatus
      security: [{session: []}]
      responses:
        '200':
          description: Authorized local sync progress; no provider request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncStatus'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/connections:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      - {name: cursor, in: query, schema: {type: string, format: uuid}}
    get:
      operationId: listConnections
      security: [{session: []}]
      responses:
        '200':
          description: Authorized connections in UUID order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectionPage'}
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: saveConnection
      security: [{session: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [family, label, credential]
              properties:
                family: {type: string, maxLength: 64}
                label: {type: string, minLength: 1, maxLength: 100}
                credential: {$ref: '#/components/schemas/WriteCredential'}
      responses:
        '201':
          description: Validated encrypted connection and initial sync committed atomically.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedConnection'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/connections/{connection_id}:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: connection_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getConnection
      security: [{session: []}]
      responses:
        '200':
          description: Safe authorized connection metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectionView'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/connections/{connection_id}/capabilities:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: connection_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getConnectionCapabilities
      security: [{session: []}]
      responses:
        '200':
          description: Effective reasons; this projection never authorizes dispatch.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capabilities'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/connections/{connection_id}/syncs:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: connection_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: refreshConnection
      security: [{session: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '202':
          description: Durable coalesced refresh accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sync_id]
                properties:
                  sync_id: {type: string, format: uuid}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/connections/{connection_id}/credential-rotations:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: connection_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: rotateConnectionCredential
      security: [{session: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [credential], properties: {credential: {$ref: '#/components/schemas/WriteCredential'}}}
      responses:
        '200':
          description: Validated credential version and audit committed atomically.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version]
                properties:
                  version: {type: integer, minimum: 1}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/connections/{connection_id}/disable:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: connection_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: disableConnection
      security: [{session: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: New work disabled; provider credentials are not revoked.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, message]
                properties:
                  status: {type: string, const: disabled}
                  message: {type: string}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/connection-validations:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: previewConnectionCredential
      security: [{session: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [family, credential]
              properties:
                family: {type: string, maxLength: 128}
                credential: {$ref: '#/components/schemas/WriteCredential'}
      responses:
        '200':
          description: Safe read-only preview; never authority for a subsequent save or rotation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConnectionPreview'}
        default:
          $ref: '#/components/responses/Problem'
  /readyz:
    get:
      operationId: getCredentialReadiness
      responses:
        '200':
          description: Database credential references have mounted keys; not provider qualification.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/connections/{connection_id}/grants:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: connection_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getOwnConnectionGrant
      security: [{session: []}]
      parameters:
        - {name: user_id, in: query, schema: {type: string, format: uuid}, description: Management-only member projection with current ceilings.}
      responses:
        '200':
          description: The current caller's explicit action classes; empty means denied.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/GrantView'}
                  - type: object
                    additionalProperties: false
                    required: [actions]
                    properties:
                      actions: {$ref: '#/components/schemas/GrantActions'}
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: setConnectionGrant
      security: [{session: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id, actions]
              properties:
                user_id: {type: string, format: uuid}
                actions: {$ref: '#/components/schemas/GrantActions'}
      responses:
        '204':
          description: Explicit grant and audit committed. Owners must grant themselves; admins delegate within existing authority.
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces/{workspace_id}/settings:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getWorkspaceSettings
      security: [{session: []}]
      responses:
        '200':
          description: Current owner-managed workspace policy.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceSettings'}
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: updateWorkspaceSettings
      security: [{session: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspaceSettings'}
      responses:
        '200':
          description: Settings and audit committed together; stale policy version returns 409.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspaceSettings'}
        default:
          $ref: '#/components/responses/Problem'
  /health:
    get:
      operationId: getHealth
      summary: Report process liveness
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The HTTP process is live; dependency readiness is not implied.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Problem'
  /auth/login:
    get:
      operationId: startLogin
      summary: Start a bounded OIDC login with a one-use browser-bound challenge
      responses:
        '302':
          description: Redirect to the configured issuer with state, nonce and S256 PKCE.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'

    post:
      operationId: startInvitedLogin
      summary: Bind invitation proof to the browser challenge; admission waits for verified OIDC callback
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [invitation]
              properties:
                invitation: {type: string, minLength: 43, maxLength: 43}
      responses:
        '200':
          description: With Accept application/json, return the configured issuer authorization URL for browser navigation; invitation proof is never included.
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url]
                properties:
                  authorization_url: {type: string, format: uri}
        '302':
          description: Browser-bound OIDC redirect. This preauthentication initiation requires configured Origin and JSON; it creates no session or membership.
        default:
          $ref: '#/components/responses/Problem'

  /auth/reauthenticate:
    post:
      operationId: reauthenticate
      security: [{session: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '302':
          description: Session-bound OIDC redirect using prompt=login, max_age=0 and configured ACR. Callback requires fresh auth_time and rotates the same identity's session.
        default:
          $ref: '#/components/responses/Problem'

  /auth/callback:
    get:
      operationId: finishLogin
      summary: Consume a browser-bound OIDC challenge and issue an admitted user session
      parameters:
        - {name: state, in: query, required: true, schema: {type: string}}
        - {name: code, in: query, required: true, schema: {type: string}}
      responses:
        '302':
          description: Session cookie issued; redirect to the same-origin overview.
          headers:
            Set-Cookie:
              schema: {type: string}
        default:
          $ref: '#/components/responses/Problem'

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session and expire its cookie
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      responses:
        '204':
          description: Session revoked or already absent; session cookie expired.
          headers:
            Set-Cookie:
              schema: {type: string}
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/me:
    get:
      operationId: getCurrentUser
      security: [{session: []}]
      responses:
        '200':
          description: Safe current-user metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/workspaces:
    get:
      operationId: listWorkspaces
      security: [{session: []}]
      parameters:
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Current workspace memberships in stable UUID order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkspacePage'}
        default:
          $ref: '#/components/responses/Problem'

    post:
      operationId: createWorkspace
      security: [{session: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
      responses:
        '201':
          description: Workspace and creator ownership committed with audit.
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/workspaces/{workspace_id}/members:
    get:
      operationId: listMembers
      security: [{session: []}]
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      responses:
        '200':
          description: Owners see all members; admins see viewer/operator members, ordered by user UUID.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberPage'}
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/workspaces/{workspace_id}/members/{user_id}:
    parameters:
      - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: assignMember
      security: [{session: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, version]
              properties:
                version: {type: integer, minimum: 0}
                role: {type: string, enum: [viewer, operator, admin, owner]}
      responses:
        '204':
          description: Membership and audit committed; stale versions or final-owner removal return 409.
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeMember
      security: [{session: []}]
      parameters:
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: {type: integer, minimum: 0}
      responses:
        '204':
          description: Membership and audit committed; stale versions or final-owner removal return 409.
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/workspaces/{workspace_id}/ownership-transfers:
    post:
      operationId: transferOwnership
      security: [{session: []}]
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user_id, actor_version, target_version]
              properties:
                user_id: {type: string, format: uuid}
                actor_version: {type: integer, minimum: 1}
                target_version: {type: integer, minimum: 1}
                demote: {type: boolean, default: false}
      responses:
        '204':
          description: Current member becomes owner; caller optionally becomes admin. Both version preconditions must match.
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/workspaces/{workspace_id}/invitations:
    post:
      operationId: issueInvitation
      security: [{session: []}]
      parameters:
        - {name: workspace_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Origin, in: header, required: true, schema: {type: string}}
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject, role]
              properties:
                subject: {type: string, minLength: 1, maxLength: 255}
                role: {type: string, enum: [viewer, operator, admin, owner]}
      responses:
        '201':
          description: One-use invitation for the configured issuer, valid 24 hours. Share manually; proof is returned only once.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token]
                properties:
                  token: {type: string, minLength: 43, maxLength: 43}
        default:
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    session: {type: apiKey, in: cookie, name: __Host-sama_session}
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Invalid or overlong values are replaced with a generated identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]+$'
  headers:
    RequestId:
      description: Bounded request correlation identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9._-]+$'
  responses:
    Problem:
      description: Stable HTTP error envelope. Unknown routes do not imply domain operations.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFoundProblem:
      description: An unimplemented or unknown route; status 404.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MethodNotAllowedProblem:
      description: A known route called with an unsupported method; status 405.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    WorkspaceOverview:
      type: object
      additionalProperties: false
      required: [connection_count, resource_count, pending_operations, unknown_operations, stale_connections, connections, connections_truncated]
      properties:
        connection_count: {type: integer, minimum: 0}
        resource_count: {type: integer, minimum: 0}
        pending_operations: {type: integer, minimum: 0}
        unknown_operations: {type: integer, minimum: 0}
        stale_connections: {type: integer, minimum: 0}
        connections_truncated: {type: boolean}
        connections:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [id, label, provider, account_identity, status, permissions_verified_at, inventory]
            properties:
              id: {type: string, format: uuid}
              label: {type: string}
              provider: {type: string}
              account_identity: {type: string}
              status: {type: string, enum: [active, disabled]}
              permissions_verified_at: {type: [string, 'null'], format: date-time}
              inventory: {$ref: '#/components/schemas/InventoryFreshness'}
    OperationState:
      type: string
      enum: [queued, dispatching, waiting_provider, reconciling, unknown, succeeded, failed, cancelled]
    OperationEvent:
      type: object
      additionalProperties: false
      required: [sequence, state, created_at]
      properties:
        sequence: {type: integer, minimum: 1}
        state: {$ref: '#/components/schemas/OperationState'}
        created_at: {type: string, format: date-time}
    OperationView:
      type: object
      additionalProperties: false
      required: [id, connection_id, resource_id, actor_id, action, state, uncertain, reservation_released, target_name, native_id, provider, account_identity, region, provider_reference, created_at, updated_at, events]
      properties:
        id: {type: string, format: uuid}
        connection_id: {type: string, format: uuid}
        resource_id: {type: string, format: uuid}
        actor_id: {type: string, format: uuid}
        action: {type: string}
        state: {$ref: '#/components/schemas/OperationState'}
        uncertain: {type: boolean, description: True for the unresolved unknown state.}
        reservation_released: {type: boolean, description: Owner acknowledged residual risk; this does not establish provider success.}
        target_name: {type: string, maxLength: 200}
        native_id: {type: string, maxLength: 512}
        provider: {type: string}
        account_identity: {type: string}
        region: {type: string}
        provider_reference: {type: [string, 'null'], maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        events: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/OperationEvent'}}
    OperationPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/OperationView'}}
        next_cursor: {type: [string, 'null']}
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, actor_kind, actor_id, action, created_at, metadata]
      properties:
        id: {type: string, format: uuid}
        actor_kind: {type: string, enum: [user, system, installation]}
        actor_id: {type: [string, 'null'], format: uuid}
        action: {type: string}
        created_at: {type: string, format: date-time}
        metadata:
          type: object
          additionalProperties: false
          properties:
            connection_id: {type: string, format: uuid}
            operation_id: {type: string, format: uuid}
            resource_id: {type: string, format: uuid}
            member_id: {type: string, format: uuid}
            role: {type: string}
            policy_version: {type: string}
            reason_code: {type: string}
    AuditPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/AuditEntry'}}
        next_cursor: {type: [string, 'null']}
    SavedConnection:
      type: object
      additionalProperties: false
      required: [id, sync_id, account_identity, verified_at, capabilities]
      properties:
        id: {type: string, format: uuid}
        sync_id: {type: string, format: uuid}
        account_identity: {type: string, maxLength: 512}
        verified_at: {type: string, format: date-time}
        capabilities: {$ref: '#/components/schemas/Capabilities'}
    ReservationRelease:
      type: object
      additionalProperties: false
      required: [residual_risk_acknowledged, typed_target]
      properties:
        residual_risk_acknowledged: {type: boolean, enum: [true]}
        typed_target: {type: string, minLength: 1, maxLength: 200}
    AcceptedOperation:
      type: object
      additionalProperties: false
      required: [id, state]
      properties:
        id: {type: string, format: uuid}
        state: {type: string, enum: [queued, dispatching, waiting_provider, reconciling, unknown, succeeded, failed, cancelled]}
    PowerIntent:
      type: object
      additionalProperties: false
      required: [action, parameters]
      properties:
        action: {type: string, enum: [compute.server.power_on, compute.server.shutdown, compute.server.power_off, compute.server.reboot]}
        parameters: {type: object, additionalProperties: false}
    ActionReview:
      type: object
      additionalProperties: false
      required: [id, resource_id, action, target_name, high_impact, expires_at]
      properties:
        id: {type: string, format: uuid}
        resource_id: {type: string, format: uuid}
        action: {type: string}
        target_name: {type: string, minLength: 1, maxLength: 200}
        high_impact: {type: boolean}
        expires_at: {type: string, format: date-time}
    Resource:
      type: object
      additionalProperties: false
      required: [id, connection_id, provider, api_family, account_identity, type, scope, native_id, name, region, status, native_status, observed_at, inventory]
      properties:
        id: {type: string, format: uuid}
        connection_id: {type: string, format: uuid}
        provider: {type: string}
        api_family: {type: string}
        account_identity: {type: string}
        type: {type: string, enum: [compute.server]}
        scope: {type: string}
        native_id: {type: string}
        name: {type: string}
        region: {type: string}
        status: {type: string, enum: [unknown, running, stopped, pending, failed]}
        native_status: {type: string}
        observed_at: {type: string, format: date-time}
        inventory: {$ref: '#/components/schemas/InventoryFreshness'}
    ResourceDetail:
      type: object
      additionalProperties: false
      required: [id, connection_id, provider, api_family, account_identity, type, scope, native_id, name, region, status, native_status, observed_at, inventory, details_version, details, available_actions]
      properties:
        id: {type: string, format: uuid}
        connection_id: {type: string, format: uuid}
        provider: {type: string}
        api_family: {type: string}
        account_identity: {type: string}
        type: {type: string, enum: [compute.server]}
        scope: {type: string}
        native_id: {type: string}
        name: {type: string}
        region: {type: string}
        status: {type: string, enum: [unknown, running, stopped, pending, failed]}
        native_status: {type: string}
        observed_at: {type: string, format: date-time}
        inventory: {$ref: '#/components/schemas/InventoryFreshness'}
        details_version: {type: integer, enum: [1]}
        details:
          type: object
          additionalProperties: false
          properties:
            region: {type: string}
            machine_type: {type: string}
        available_actions: {$ref: '#/components/schemas/Capabilities'}
    ResourcePage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Resource'}}
        next_cursor: {type: [string, 'null']}
    InventoryFreshness:
      type: object
      additionalProperties: false
      required: [last_success_at, failure_code, state]
      properties:
        last_success_at: {type: [string, 'null'], format: date-time}
        failure_code: {$ref: '#/components/schemas/SyncFailure'}
        state: {type: string, enum: [fresh, stale, never_observed]}
    SyncFailure:
      type: [string, 'null']
      enum: [permission_denied, provider_unavailable, provider_rate_limited, provider_response_invalid, sync_limit_reached, null]
    SyncStatus:
      type: object
      additionalProperties: false
      required: [id, connection_id, status, page_count, started_at, completed_at, failure_code, inventory]
      properties:
        id: {type: string, format: uuid}
        connection_id: {type: string, format: uuid}
        status: {type: string, enum: [pending, running, succeeded, failed, cancelled]}
        page_count: {type: integer, minimum: 0}
        started_at: {type: [string, 'null'], format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        failure_code: {$ref: '#/components/schemas/SyncFailure'}
        inventory: {$ref: '#/components/schemas/InventoryFreshness'}
    WriteCredential:
      oneOf:
        - {$ref: '#/components/schemas/BearerCredential'}
        - {$ref: '#/components/schemas/ContaboCredential'}
        - {$ref: '#/components/schemas/NetcupLegacyCredential'}
      discriminator:
        propertyName: type
        mapping:
          bearer_v1: '#/components/schemas/BearerCredential'
          contabo_v1: '#/components/schemas/ContaboCredential'
          netcup_legacy_v1: '#/components/schemas/NetcupLegacyCredential'
    BearerCredential:
      type: object
      additionalProperties: false
      required: [type, token]
      properties:
        type: {type: string, const: bearer_v1}
        token: {type: string, minLength: 1, maxLength: 4096, writeOnly: true}
    ContaboCredential:
      type: object
      additionalProperties: false
      required: [type, client_id, client_secret, username, password]
      properties:
        type: {type: string, const: contabo_v1}
        client_id: {type: string, minLength: 1, maxLength: 4096, writeOnly: true}
        client_secret: {type: string, minLength: 1, maxLength: 4096, writeOnly: true}
        username: {type: string, minLength: 1, maxLength: 4096, writeOnly: true}
        password: {type: string, minLength: 1, maxLength: 4096, writeOnly: true}
    NetcupLegacyCredential:
      type: object
      additionalProperties: false
      required: [type, customer_number, api_key, api_password]
      properties:
        type: {type: string, const: netcup_legacy_v1}
        customer_number: {type: string, pattern: '^[1-9][0-9]{0,19}$', writeOnly: true}
        api_key: {type: string, minLength: 1, maxLength: 4096, writeOnly: true}
        api_password: {type: string, minLength: 1, maxLength: 4096, writeOnly: true}
    Capabilities:
      type: array
      items: {$ref: '#/components/schemas/Capability'}
    ConnectionView:
      type: object
      additionalProperties: false
      required: [id, workspace_id, provider, api_family, account_identity, region_policy, label, status, active_credential_version, permissions_verified_at, capabilities, inventory]
      properties:
        id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        provider: {type: string}
        api_family: {type: string}
        account_identity: {type: string}
        region_policy: {type: array, items: {type: string}}
        label: {type: string}
        status: {type: string, enum: [active, disabled]}
        active_credential_version: {type: [integer, 'null'], format: int64}
        permissions_verified_at: {type: [string, 'null'], format: date-time}
        inventory: {$ref: '#/components/schemas/InventoryFreshness'}
        capabilities: {$ref: '#/components/schemas/Capabilities'}
    ConnectionPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/ConnectionView'}}
        next_cursor: {type: [string, 'null'], format: uuid}
    Capability:
      type: object
      additionalProperties: false
      required: [action, available, reason]
      properties:
        action: {type: string}
        available: {type: boolean}
        reason: {type: string, enum: [available, unsupported, unverified, denied, state_restricted]}
    ConnectionPreview:
      type: object
      additionalProperties: false
      required: [account_identity, verified_at, capabilities]
      properties:
        account_identity: {type: string, maxLength: 512}
        verified_at: {type: string, format: date-time}
        capabilities: {type: array, items: {$ref: '#/components/schemas/Capability'}}
    GrantView:
      type: object
      additionalProperties: false
      required: [user_id, actions, allowed_actions, editable]
      properties:
        user_id: {type: string, format: uuid}
        actions: {$ref: '#/components/schemas/GrantActions'}
        allowed_actions: {$ref: '#/components/schemas/GrantActions'}
        editable: {type: boolean}
    GrantActions:
      type: array
      maxItems: 4
      uniqueItems: true
      items: {type: string, enum: [read, refresh, operate, high_impact]}
    WorkspaceSettings:
      type: object
      additionalProperties: false
      required: [name, policy_version, queue_limit, audit_retention_days]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        policy_version: {type: integer, minimum: 1}
        queue_limit: {type: integer, minimum: 1, maximum: 1000}
        audit_retention_days: {type: integer, minimum: 180, maximum: 3650}
    Member:
      type: object
      additionalProperties: false
      required: [user_id, display_name, role, version]
      properties:
        user_id: {type: string, format: uuid}
        display_name: {type: string, maxLength: 200}
        role: {type: string, enum: [viewer, operator, admin, owner]}
        version: {type: integer, minimum: 1}
    MemberPage:
      type: object
      required: [data, next_cursor]
      additionalProperties: false
      properties:
        data: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/Member'}}
        next_cursor: {type: [string, 'null'], format: uuid}
    User:
      type: object
      additionalProperties: false
      required: [id, display_name]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string, maxLength: 200}
    Workspace:
      type: object
      additionalProperties: false
      required: [id, name, role]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 100}
        role: {type: string, enum: [viewer, operator, admin, owner]}
    WorkspacePage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Workspace'}}
        next_cursor: {type: [string, 'null'], format: uuid}
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
        - request_id
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
          enum:
            - 408
            - 413
            - 431
            - 409
            - 422
            - 403
            - 401
            - 400
            - 404
            - 405
            - 429
            - 503
        code:
          type: string
          enum:
            - reauthentication_unsupported
            - recent_authentication_required
            - body_too_large
            - headers_too_large
            - request_cancelled
            - policy_conflict
            - credential_version_changed
            - queue_quota_reached
            - membership_conflict
            - not_found
            - method_not_allowed
            - invalid_workspace
            - workspace_limit
            - permission_denied
            - unauthenticated
            - invalid_request
            - rate_limited
            - provider_unavailable
            - stale_review
            - idempotency_conflict
            - resource_busy
            - unsupported_capability
            - credentials_unavailable
            - identity_unavailable
        errors:
          type: array
          maxItems: 20
          description: Optional safe validation codes for allowlisted input fields; never provider messages.
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field: {type: string, minLength: 1, maxLength: 64}
              code: {type: string, enum: [required, invalid, out_of_range]}
        request_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9._-]+$'
