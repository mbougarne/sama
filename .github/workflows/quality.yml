name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - run: sh scripts/check.sh
      - name: Real local authentication acceptance
        env:
          SAMA_DEV_PUBLIC_ORIGIN: http://127.0.0.1:8080
        run: |
          python3 dev/local.py up
          python3 -B dev/smoke.py
      - name: Stop checkout-owned local services
        if: always()
        run: python3 dev/local.py down

  frontend:
    name: Backoffice checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts --prod=false
      - run: pnpm run check

  collaboration:
    name: Collaboration tooling checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python3 -B -m unittest discover -s scripts/tests -v
      - run: python3 -B -m unittest discover -s backend/dev -p 'test_*.py' -v
      - run: python3 scripts/collab.py lint .
