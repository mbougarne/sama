name: Anthropic pull request review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ai-review-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Review configuration
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      !endsWith(github.actor, '[bot]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.select.outputs.enabled }}
      model: ${{ steps.select.outputs.model }}
    steps:
      - name: Validate Anthropic review configuration
        id: select
        env:
          REVIEW_ENABLED: ${{ vars.AI_REVIEW_ENABLED }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_REVIEW_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REVIEW_ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Anthropic review is installed but disabled. Set AI_REVIEW_ENABLED=true after its model and credential are configured."
            exit 0
          fi

          if [[ ! "$ANTHROPIC_MODEL" =~ ^[A-Za-z0-9._:/-]{1,128}$ ]]; then
            echo "ANTHROPIC_REVIEW_MODEL is empty or contains unsupported characters." >&2
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "model=$ANTHROPIC_MODEL" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze pull request
    needs: configuration
    if: needs.configuration.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
    outputs:
      anthropic_output: ${{ steps.anthropic.outputs.structured_output }}
      anthropic_conclusion: ${{ steps.anthropic.outputs.conclusion }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source

      - name: Prepare exact-SHA review evidence
        id: prepare
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          review_dir="$GITHUB_WORKSPACE/.ai-review"
          if [ -L "$review_dir" ]; then
            unlink "$review_dir"
          elif [ -e "$review_dir" ]; then
            rm -rf "$review_dir"
          fi
          mkdir -p "$review_dir"

          git -C "$GITHUB_WORKSPACE/source" fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          merge_base="$(git -C "$GITHUB_WORKSPACE/source" merge-base "$BASE_SHA" "$HEAD_SHA")"
          test -n "$merge_base"

          git -C "$GITHUB_WORKSPACE/source" diff --name-status --find-renames "$merge_base" "$HEAD_SHA" > "$review_dir/changed-files.txt"
          git -C "$GITHUB_WORKSPACE/source" diff --no-ext-diff --unified=80 --find-renames "$merge_base" "$HEAD_SHA" > "$review_dir/pr.diff"
          diff_bytes="$(wc -c < "$review_dir/pr.diff")"
          if [ "$diff_bytes" -gt 2097152 ]; then
            echo "PR diff is larger than the 2 MiB review limit; split the change or raise the reviewed limit deliberately." >&2
            exit 1
          fi

          jq '{
            pull_request: .pull_request.number,
            title: .pull_request.title,
            body: .pull_request.body,
            author: .pull_request.user.login,
            author_association: .pull_request.author_association,
            base_ref: .pull_request.base.ref,
            base_sha: .pull_request.base.sha,
            head_ref: .pull_request.head.ref,
            head_sha: .pull_request.head.sha
          }' "$GITHUB_EVENT_PATH" > "$review_dir/pr-context.json"

          git -C "$GITHUB_WORKSPACE/source" show "$BASE_SHA:.github/skills/code-review/SKILL.md" > "$review_dir/trusted-skill.md"
          git -C "$GITHUB_WORKSPACE/source" show "$BASE_SHA:.github/review/checks.md" > "$review_dir/trusted-checks.md"
          git -C "$GITHUB_WORKSPACE/source" show "$BASE_SHA:.github/review/prompt.md" > "$review_dir/trusted-prompt.md"

          : > "$review_dir/trusted-repository-policy.md"
          for policy_path in \
            AGENTS.md \
            AGENTIC_RULES.md \
            docs/AGENTIC_RULES.md \
            docs/agents/README.md \
            docs/agents/project.md \
            docs/agents/rules/COLLABORATION_RULES.md \
            docs/agents/rules/EFFICIENCY_RULES.md \
            docs/agents/rules/CODE_RULES.md \
            docs/agents/rules/RULES_GOVERNANCE.md \
            docs/agents/records.md \
            docs/agents/research.md \
            docs/agents/validation.md \
            docs/architecture/repository.md \
            docs/architecture/decisions/0001-zig-first-modular-architecture.md \
            docs/architecture/decisions/0002-out-of-process-extensions.md \
            docs/architecture/decisions/0003-open-versioned-protocols.md
          do
            if git -C "$GITHUB_WORKSPACE/source" cat-file -e "$BASE_SHA:$policy_path" 2>/dev/null; then
              printf '\n# Trusted base file: %s\n\n' "$policy_path" >> "$review_dir/trusted-repository-policy.md"
              git -C "$GITHUB_WORKSPACE/source" show "$BASE_SHA:$policy_path" >> "$review_dir/trusted-repository-policy.md"
            fi
          done

          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"

      - name: Collect current check results and prior AI reviews
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_DIR: ${{ github.workspace }}/.ai-review
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = process.env.HEAD_SHA;
            const excluded = new Set([
              'Review configuration',
              'Analyze pull request',
              'Normalize review output',
              'Publish review',
            ]);

            const checkRuns = await github.paginate(
              github.rest.checks.listForRef,
              { owner, repo, ref, per_page: 100, filter: 'latest' },
              (response) => response.data.check_runs,
            );
            const checks = checkRuns
              .filter((check) => !excluded.has(check.name))
              .map((check) => ({
                name: check.name,
                status: check.status,
                conclusion: check.conclusion,
                started_at: check.started_at,
                completed_at: check.completed_at,
                head_sha: check.head_sha,
              }));
            fs.writeFileSync(`${process.env.REVIEW_DIR}/ci-checks.json`, JSON.stringify({ head_sha: ref, checks }, null, 2));

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: Number(process.env.PR_NUMBER), per_page: 100 },
            );
            const prior = comments
              .filter((comment) => comment.user?.login === 'github-actions[bot]' && comment.body?.includes('<!-- ai-review:'))
              .slice(-10)
              .map((comment) => ({ id: comment.id, created_at: comment.created_at, body: comment.body }));
            fs.writeFileSync(`${process.env.REVIEW_DIR}/prior-reviews.json`, JSON.stringify(prior, null, 2));

      - name: Assemble the trusted review prompt
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE: ${{ steps.prepare.outputs.merge_base }}
        shell: bash
        run: |
          set -euo pipefail
          review_dir="$GITHUB_WORKSPACE/.ai-review"
          {
            printf '# Trusted automatic pull request review instructions\n\n'
            printf 'Base SHA: `%s`\n\nHead SHA: `%s`\n\nMerge base: `%s`\n\n' "$BASE_SHA" "$HEAD_SHA" "$MERGE_BASE"
            cat "$review_dir/trusted-skill.md"
            printf '\n\n# Trusted repository policy\n'
            cat "$review_dir/trusted-repository-policy.md"
            printf '\n\n# Trusted repository checks\n\n'
            cat "$review_dir/trusted-checks.md"
            printf '\n\n# Review task\n\n'
            cat "$review_dir/trusted-prompt.md"
          } > "$review_dir/prompt.md"

      - name: Review with Anthropic
        id: anthropic
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          display_report: 'false'
          show_full_output: 'false'
          include_fix_links: 'false'
          prompt: |
            Read .ai-review/prompt.md and the evidence files it names. Perform only the review described there.
            Return the final Markdown review in the review_markdown JSON field. Do not modify files or publish comments.
          claude_args: >-
            --bare
            --model ${{ needs.configuration.outputs.model }}
            --max-turns 20
            --permission-mode dontAsk
            --allowedTools Read,Glob,Grep
            --disallowedTools Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch,Task
            --no-session-persistence
            --json-schema '{"type":"object","properties":{"review_markdown":{"type":"string"}},"required":["review_markdown"],"additionalProperties":false}'

  normalize:
    name: Normalize review output
    needs: [configuration, analyze]
    if: needs.configuration.outputs.enabled == 'true' && needs.analyze.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      review_b64: ${{ steps.normalize.outputs.review_b64 }}
    steps:
      - name: Validate and encode Anthropic output
        id: normalize
        env:
          ANTHROPIC_OUTPUT: ${{ needs.analyze.outputs.anthropic_output }}
          ANTHROPIC_CONCLUSION: ${{ needs.analyze.outputs.anthropic_conclusion }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          if (process.env.ANTHROPIC_CONCLUSION !== 'success') {
            throw new Error('Anthropic review did not finish successfully.');
          }
          const parsed = JSON.parse(process.env.ANTHROPIC_OUTPUT || '');
          let review = parsed.review_markdown;

          if (typeof review !== 'string' || review.trim() === '') {
            throw new Error('Anthropic returned an empty review.');
          }
          review = review.trim();
          if (review.includes('\0')) {
            throw new Error('Anthropic returned a NUL byte.');
          }
          if (Buffer.byteLength(review, 'utf8') > 58000) {
            throw new Error('The Anthropic review exceeds the 58,000-byte publishing limit.');
          }

          const encoded = Buffer.from(review, 'utf8').toString('base64');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `review_b64=${encoded}\n`);
          NODE

  publish:
    name: Publish review
    needs: [configuration, analyze, normalize]
    if: needs.normalize.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Create or update this integration's exact-SHA comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWED_BASE_SHA: ${{ needs.analyze.outputs.base_sha }}
          REVIEWED_HEAD_SHA: ${{ needs.analyze.outputs.head_sha }}
          REVIEW_MODEL: ${{ needs.configuration.outputs.model }}
          REVIEW_B64: ${{ needs.normalize.outputs.review_b64 }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = Number(process.env.PR_NUMBER);
            const pull = (await github.rest.pulls.get({ owner, repo, pull_number: pullNumber })).data;

            if (
              pull.state !== 'open' ||
              pull.base.sha !== process.env.REVIEWED_BASE_SHA ||
              pull.head.sha !== process.env.REVIEWED_HEAD_SHA
            ) {
              core.notice('Skipping an obsolete review result because the PR closed or its base/head SHA changed.');
              return;
            }

            const marker = `<!-- ai-review:${pullNumber}:${process.env.REVIEWED_HEAD_SHA} -->`;
            const review = Buffer.from(process.env.REVIEW_B64, 'base64')
              .toString('utf8')
              .replaceAll('@', '@\u200b');
            const body = [
              marker,
              '## Automatic AI review',
              '',
              '- Provider: `Anthropic`',
              `- Model: \`${process.env.REVIEW_MODEL}\``,
              `- Reviewed base: \`${process.env.REVIEWED_BASE_SHA}\``,
              `- Reviewed head: \`${process.env.REVIEWED_HEAD_SHA}\``,
              '',
              review,
            ].join('\n');

            if (Buffer.byteLength(body, 'utf8') > 65000) {
              throw new Error('The final comment exceeds the configured GitHub comment limit.');
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: pullNumber, per_page: 100 },
            );
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pullNumber, body });
            }
